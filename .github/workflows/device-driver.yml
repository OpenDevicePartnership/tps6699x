permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
name: device-driver-pregen-check
jobs:
  device-driver-pregen-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: device-driver-pregen-check
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - name: Install pinned formatter
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: '1.94.0'
          components: rustfmt
      - name: Format the CI checkout copy of the generated driver
        # Preserve the unformatted committed file; compare both sides after rustfmt.
        run: rustup run 1.94.0 rustfmt --edition 2024 --config newline_style=Unix src/registers/generated.rs
      - name: Check generated device driver
        uses: tullom/device-driver-pregen-check@v1.2.0
        with:
          source: device.ddsl
          generated-file: src/registers/generated.rs
          cli-version: '2.1.1'
          rust-toolchain: '1.94.0'
          rust-defmt-feature: defmt
